<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const TYPE_CHIPS = [
  "열정적인", "차분한", "엉뚱한", "친절한", "까칠한", "신비로운", "유쾌한", "냉정한", "다정한", "도도한",
  "수줍은", "장난꾸러기", "완벽주의", "게으른", "허당끼있는", "고집센", "감성적인", "털털한", "예민한", "낙천적인",
  "야망있는", "겁많은", "순수한", "카리스마있는", "몽상가", "현실적인", "질투많은", "책임감있는", "자유분방한", "느긋한",

const MAX_RESIDENTS = 30;
const AUTOPLAY_MS = 1500;
const BABY_NAMES = ["몽이", "콩이", "하늘이", "별이", "달이", "솜이", "복이", "구름이", "봄이", "여름이", "라온이", "다온이"];

const DEFAULT_GOD_ITEMS = [
  { id: "fruit", icon: "🍎", label: "신선한 과일", desc: "배고픔 -40", type: "hunger", amount: 40, needsTarget: false },
  { id: "cake", icon: "🍰", label: "축제 케이크", desc: "배고픔 완전 회복", type: "hunger", amount: 100, needsTarget: false },
  { id: "blanket", icon: "🧸", label: "포근한 담요", desc: "외로움 -35", type: "loneliness", amount: 35, needsTarget: false },
  { id: "bed", icon: "🛌", label: "아늑한 잠자리", desc: "외로움 완전 회복", type: "loneliness", amount: 100, needsTarget: false },
  { id: "clover", icon: "🍀", label: "행운의 네잎클로버", desc: "3턴 동안 상호작용이 잘 풀려요", type: "luck", needsTarget: false },
  { id: "flower", icon: "🌸", label: "축복의 꽃다발", desc: "지목한 상대와 호감도 +15", type: "relationship", amount: 15, needsTarget: true },
  { id: "ring", icon: "💍", label: "언약의 반지", desc: "지목한 상대와 호감도 +25 (결혼이 가까워져요)", type: "relationship", amount: 25, needsTarget: true },
  { id: "hanky", icon: "🕊️", label: "화해의 손수건", desc: "마이너스 호감도를 0으로 씻어줘요", type: "reconcile", needsTarget: true },
];

const RELATION_PRESETS = [
  { value: "지인", label: "지인 (기본)", score: 0 },
  { value: "친구", label: "친구", score: 40 },
  { value: "절친", label: "절친", score: 80 },
  { value: "앙숙", label: "앙숙", score: -50 },
  { value: "연인", label: "연인 💑", score: 85 },
  { value: "결혼", label: "결혼 💍", score: 85 },
];

const TALK_RESPONSES = [
  "정말요? 당신이 그렇게 말해주니 기분이 좋아져요!",
  "신이시여... 오늘도 지켜봐 주셔서 감사해요.",
  "음... 잘 모르겠지만, 당신 말이라면 믿어볼게요!",
  "헤헤, 괜히 마음이 몽글몽글해지네요.",
  "그 말, 마음속 깊이 새겨둘게요.",
  "당신과 이야기하니 외로움이 사라지는 것 같아요.",
  "오늘 하루도 힘내볼게요, 응원해줘서 고마워요!",
  "가끔은 당신이 진짜 존재하나 궁금했는데... 지금은 확실히 느껴져요.",
];

const QUIRKY_EVENTS = [
  (name) => `🎪 ${name}가 갑자기 물구나무를 서서 걸어다니기 시작했습니다! 다들 어리둥절해합니다.`,
  (name) => `🍄 ${name}가 숲에서 신비한 버섯을 발견하고 하루 종일 몽롱한 기분을 느꼈습니다.`,
  (name) => `🎨 ${name}가 밤새 아일랜드 벽에 정체불명의 그림을 그려놓았습니다.`,
  (name) => `🌊 ${name}가 파도에 떠밀려온 낡은 보물 상자를 발견했습니다!`,
  (name) => `🦄 ${name}가 무지개 뒤에서 신비한 존재를 봤다고 주장합니다.`,
  (name) => `🎤 ${name}가 갑자기 즉흥 랩을 시작해서 주민들을 깜짝 놀라게 했습니다.`,
  (name) => `🐚 ${name}가 조개껍질에서 나는 소리를 듣고 알 수 없는 눈물을 흘렸습니다.`,
  (name) => `🔥 ${name}가 요리를 하다가 작은 불쇼를 선보였습니다 (다행히 다치지 않았어요).`,
  (name) => `🧭 ${name}가 나침반도 없이 섬을 한 바퀴 완주하고 돌아왔습니다.`,
  (name) => `👻 ${name}가 한밤중에 이상한 그림자를 보고 소리를 질렀습니다.`,
  (name) => `🪁 ${name}가 직접 만든 연을 날리다가 하늘로 살짝 떠올랐다고 주장합니다.`,
  (name) => `🎁 ${name}가 정체불명의 선물 상자를 발견했지만 열어보길 망설이고 있습니다.`,
];

const NOTE_STOPWORDS = new Set([
  "그리고", "그러나", "그래서", "정말", "너무", "진짜", "아주", "매우", "같아요", "싶어요", "합니다", "입니다",
  "있어요", "해요", "조금", "항상", "자주", "그냥", "약간", "엄청", "완전", "등등", "등", "걸", "것", "거",
  "수", "때", "좀", "막", "또", "그", "저", "나", "제가", "저는", "그는", "그녀는", "이런", "저런", "그런",
  "하는", "하고", "하지만", "때문에", "위해", "위한", "대한", "대해", "정도", "사람", "성격",
]);
function extractKeywords(note) {
  if (!note) return [];
  const tokens = note
    .replace(/[.,!?~^ㅋㅎㅠㅜ:;()"'\n\r]+/g, " ")
    .split(/\s+/)
    .map((t) => t.trim())
    .filter((t) => t.length >= 2 && !NOTE_STOPWORDS.has(t));
  return Array.from(new Set(tokens)).slice(0, 8);
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function relKey(a, b) {
  return [a, b].sort().join("|");
}
function statusFromScore(score, currentStatus) {
  if (currentStatus === "가족") return "가족";
  if (currentStatus === "결혼") return "결혼";
  if (currentStatus === "연인") return "연인";
  if (score >= 70) return "절친";
  if (score >= 30) return "친구";
  if (score <= -30) return "앙숙";
  return "지인";
}
function statusColor(status) {
  switch (status) {
    case "가족":
      return "var(--family)";
    case "결혼":
      return "var(--marriage)";
    case "연인":
      return "var(--love)";
    case "절친":
      return "var(--gold)";
    case "친구":
      return "var(--good)";
    case "앙숙":
      return "var(--warn)";
    default:
      return "var(--ink-soft)";
  }
}

function MoaIslandSim() {
  const [islandName, setIslandName] = useState("");
  const [characters, setCharacters] = useState([]);
  const [relationships, setRelationships] = useState({});
  const [eventLog, setEventLog] = useState([]);
  const [newsLog, setNewsLog] = useState([]);
  const [turn, setTurn] = useState(0);
  const [autoPlay, setAutoPlay] = useState(false);
  const [pendingRequests, setPendingRequests] = useState([]);
  const [namingBaby, setNamingBaby] = useState(null);
  const [babyNameInput, setBabyNameInput] = useState("");
  const [showHelp, setShowHelp] = useState(false);
  const [selectedCharId, setSelectedCharId] = useState(null);

  const [formName, setFormName] = useState("");
  const [formType, setFormType] = useState("");
  const [formSoc, setFormSoc] = useState(50);
  const [formEmo, setFormEmo] = useState(50);
  const [formNote, setFormNote] = useState("");

  const [setupAId, setSetupAId] = useState("");
  const [setupBId, setSetupBId] = useState("");
  const [setupStatus, setSetupStatus] = useState("지인");

  const [talkTargetId, setTalkTargetId] = useState("");
  const [talkMessage, setTalkMessage] = useState("");

  const [giftTargetId, setGiftTargetId] = useState("");
  const [giftSecondTargetId, setGiftSecondTargetId] = useState("");
  const [godItems, setGodItems] = useState(DEFAULT_GOD_ITEMS);
  const [customItemIcon, setCustomItemIcon] = useState("🎁");
  const [customItemLabel, setCustomItemLabel] = useState("");
  const [customItemType, setCustomItemType] = useState("hunger");
  const [customItemAmount, setCustomItemAmount] = useState(30);

  const addResident = () => {
    const nm = formName.trim();
    if (!nm || characters.length >= MAX_RESIDENTS) return;
    const id = `m-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
    const newChar = {
      id,
      name: nm,
      personalityType: formType.trim() || "평범한",
      sociability: formSoc / 100,
      emotional: formEmo / 100,
      hunger: randInt(10, 40),
      loneliness: randInt(10, 40),
      partner: null,
      luckyTurns: 0,
      note: formNote.trim(),
      keywords: extractKeywords(formNote.trim()),
    };
    setCharacters((prev) => [...prev, newChar]);
    setRelationships((prev) => {
      const next = { ...prev };
      characters.forEach((existing) => {
        next[relKey(id, existing.id)] = { score: 0, status: "지인" };
      });
      return next;
    });
    setFormName("");
    setFormType("");
    setFormSoc(50);
    setFormEmo(50);
    setFormNote("");
  };

  const removeResident = (id) => {
    setCharacters((prev) => prev.filter((c) => c.id !== id).map((c) => (c.partner === id ? { ...c, partner: null } : c)));
    setRelationships((prev) => {
      const next = { ...prev };
      Object.keys(next).forEach((k) => {
        if (k.split("|").includes(id)) delete next[k];
      });
      return next;
    });
    setGiftTargetId((prev) => (prev === id ? "" : prev));
    setGiftSecondTargetId((prev) => (prev === id ? "" : prev));
    setTalkTargetId((prev) => (prev === id ? "" : prev));
    setSelectedCharId((prev) => (prev === id ? null : prev));
    setSetupAId((prev) => (prev === id ? "" : prev));
    setSetupBId((prev) => (prev === id ? "" : prev));
    setPendingRequests((prev) => prev.filter((r) => r.aId !== id && r.bId !== id));
    setNamingBaby((prev) => (prev && (prev.aId === id || prev.bId === id) ? null : prev));
  };

  const resetAll = () => {
    setCharacters([]);
    setRelationships({});
    setEventLog([]);
    setNewsLog([]);
    setTurn(0);
    setAutoPlay(false);
    setGiftTargetId("");
    setGiftSecondTargetId("");
    setTalkTargetId("");
    setTalkMessage("");
    setPendingRequests([]);
    setNamingBaby(null);
    setBabyNameInput("");
    setSelectedCharId(null);
    setSetupAId("");
    setSetupBId("");
    setSetupStatus("지인");
    setGodItems(DEFAULT_GOD_ITEMS);
  };

  const applyInitialRelationship = () => {
    if (!setupAId || !setupBId || setupAId === setupBId) return;
    const preset = RELATION_PRESETS.find((p) => p.value === setupStatus) || RELATION_PRESETS[0];
    const aChar = characters.find((c) => c.id === setupAId);
    const bChar = characters.find((c) => c.id === setupBId);
    if (!aChar || !bChar) return;
    setRelationships((prev) => ({
      ...prev,
      [relKey(setupAId, setupBId)]: { score: preset.score, status: preset.value },
    }));
    if (preset.value === "연인" || preset.value === "결혼") {
      setCharacters((prev) =>
        prev.map((c) => (c.id === setupAId ? { ...c, partner: setupBId } : c.id === setupBId ? { ...c, partner: setupAId } : c))
      );
    }
    setEventLog((prev) =>
      [`🔧 [관계 설정] ${aChar.name}와(과) ${bChar.name}의 관계를 '${preset.value}'(으)로 설정했습니다.`, ...prev].slice(0, 100)
    );
  };

  const talkToCharacter = () => {
    if (!talkTargetId || !talkMessage.trim()) return;
    const target = characters.find((c) => c.id === talkTargetId);
    if (!target) return;
    const kw = target.keywords && target.keywords.length > 0 ? target.keywords[randInt(0, target.keywords.length - 1)] : null;
    const response =
      kw && Math.random() < 0.5
        ? `제가 '${kw}' 얘기를 적어뒀던 거, 신께서도 알고 계셨군요! 그런 걸 알아봐 주시니 기뻐요.`
        : TALK_RESPONSES[randInt(0, TALK_RESPONSES.length - 1)];
    const msg = talkMessage.trim();
    setCharacters((prev) => prev.map((c) => (c.id === talkTargetId ? { ...c, loneliness: Math.max(0, c.loneliness - 30) } : c)));
    setEventLog((prev) =>
      [`🌟 [신의 목소리] 당신 → ${target.name}: "${msg}"  💬 ${target.name}: "${response}"`, ...prev].slice(0, 100)
    );
    setTalkMessage("");
  };

  const giveItem = (item) => {
    if (!giftTargetId) return;
    const target = characters.find((c) => c.id === giftTargetId);
    if (!target) return;

    if (!item.needsTarget) {
      if (item.type === "hunger") {
        setCharacters((prev) => prev.map((c) => (c.id === giftTargetId ? { ...c, hunger: Math.max(0, c.hunger - item.amount) } : c)));
      } else if (item.type === "loneliness") {
        setCharacters((prev) => prev.map((c) => (c.id === giftTargetId ? { ...c, loneliness: Math.max(0, c.loneliness - item.amount) } : c)));
      } else if (item.type === "luck") {
        setCharacters((prev) => prev.map((c) => (c.id === giftTargetId ? { ...c, luckyTurns: 3 } : c)));
      }
      setEventLog((prev) =>
        [`🎁 [신의 선물] 당신이 ${target.name}에게 ${item.icon} ${item.label}을(를) 선물했습니다. ${target.name}가 매우 기뻐합니다!`, ...prev].slice(0, 100)
      );
    } else {
      if (!giftSecondTargetId || giftSecondTargetId === giftTargetId) return;
      const partnerChar = characters.find((c) => c.id === giftSecondTargetId);
      if (!partnerChar) return;
      const key = relKey(giftTargetId, giftSecondTargetId);
      if (item.type === "relationship") {
        setRelationships((prev) => {
          const cur = prev[key] || { score: 0, status: "지인" };
          const newScore = Math.min(100, cur.score + item.amount);
          const newStatus = statusFromScore(newScore, cur.status);
          return { ...prev, [key]: { ...cur, score: newScore, status: newStatus } };
        });
        setEventLog((prev) =>
          [
            `🎁 [신의 선물] 당신이 ${target.name}에게 ${item.icon} ${item.label}을(를) 주며 ${partnerChar.name}과(와)의 사이를 축복했습니다! (호감도 +${item.amount})`,
            ...prev,
          ].slice(0, 100)
        );
      } else if (item.type === "reconcile") {
        setRelationships((prev) => {
          const cur = prev[key] || { score: 0, status: "지인" };
          const newScore = Math.max(cur.score, 0);
          const newStatus = statusFromScore(newScore, cur.status);
          return { ...prev, [key]: { ...cur, score: newScore, status: newStatus } };
        });
        setEventLog((prev) =>
          [`🕊️ [신의 중재] 당신이 ${target.name}와(과) ${partnerChar.name} 사이의 앙금을 씻어주었습니다.`, ...prev].slice(0, 100)
        );
      }
    }
    setGiftSecondTargetId("");
  };

  const addCustomItem = () => {
    const label = customItemLabel.trim();
    if (!label) return;
    const needsTarget = customItemType === "relationship" || customItemType === "reconcile";
    const desc =
      customItemType === "hunger"
        ? `배고픔 -${customItemAmount}`
        : customItemType === "loneliness"
        ? `외로움 -${customItemAmount}`
        : customItemType === "luck"
        ? "3턴 동안 상호작용이 잘 풀려요"
        : customItemType === "relationship"
        ? `지목한 상대와 호감도 +${customItemAmount}`
        : "마이너스 호감도를 0으로 씻어줘요";
    const newItem = {
      id: `custom-${Date.now()}`,
      icon: customItemIcon.trim() || "🎁",
      label,
      desc,
      type: customItemType,
      amount: customItemAmount,
      needsTarget,
      custom: true,
    };
    setGodItems((prev) => [...prev, newItem]);
    setCustomItemLabel("");
  };

  const removeCustomItem = (id) => {
    setGodItems((prev) => prev.filter((i) => i.id !== id));
  };

  const resolveRequest = (requestId, approve) => {
    const req = pendingRequests.find((r) => r.id === requestId);
    if (!req) return;
    const a = characters.find((c) => c.id === req.aId);
    const b = characters.find((c) => c.id === req.bId);

    if (req.type === "confess") {
      if (approve && a && b) {
        setCharacters((prev) => prev.map((c) => (c.id === req.aId ? { ...c, partner: req.bId } : c.id === req.bId ? { ...c, partner: req.aId } : c)));
        setRelationships((prev) => {
          const key = relKey(req.aId, req.bId);
          const cur = prev[key] || { score: 0, status: "지인" };
          return { ...prev, [key]: { ...cur, status: "연인" } };
        });
        setEventLog((prev) => [`💖 [신의 축복] 당신의 허락으로 ${a.name}와(과) ${b.name}가 연인이 되었습니다!`, ...prev].slice(0, 100));
        setNewsLog((prev) => [...prev, { text: `🎉 축하합니다! ${a.name}님과 ${b.name}님이 연애를 시작했습니다! (Turn ${turn})`, category: "romance" }]);
        setPendingRequests((prev) =>
          prev.filter((r) => r.id !== requestId && !(r.type === "confess" && (r.aId === req.aId || r.bId === req.aId || r.aId === req.bId || r.bId === req.bId)))
        );
      } else {
        if (a && b) {
          setRelationships((prev) => {
            const key = relKey(req.aId, req.bId);
            const cur = prev[key] || { score: 0, status: "지인" };
            return { ...prev, [key]: { ...cur, score: Math.max(-100, cur.score - 15), confessCooldownUntilTurn: turn + 5 } };
          });
          setEventLog((prev) => [`🙅 [신의 뜻] 당신은 ${a.name}와(과) ${b.name}의 고백을 허락하지 않았습니다.`, ...prev].slice(0, 100));
        }
        setPendingRequests((prev) => prev.filter((r) => r.id !== requestId));
      }
    } else if (req.type === "marriage") {
      if (approve && a && b) {
        setRelationships((prev) => {
          const key = relKey(req.aId, req.bId);
          const cur = prev[key] || { score: 0, status: "연인" };
          return { ...prev, [key]: { ...cur, status: "결혼" } };
        });
        setEventLog((prev) => [`🎊 [신의 축복] 당신의 허락으로 ${a.name}와(과) ${b.name}가 결혼식을 올렸습니다!`, ...prev].slice(0, 100));
        setNewsLog((prev) => [...prev, { text: `💒 축하합니다! ${a.name}님과 ${b.name}님이 결혼했습니다! (Turn ${turn})`, category: "romance" }]);
      } else if (a && b) {
        setRelationships((prev) => {
          const key = relKey(req.aId, req.bId);
          const cur = prev[key] || { score: 0, status: "연인" };
          return { ...prev, [key]: { ...cur, score: Math.max(-100, cur.score - 5), marriageCooldownUntilTurn: turn + 5 } };
        });
        setEventLog((prev) => [`🙅 [신의 뜻] 당신은 ${a.name}와(과) ${b.name}의 결혼을 아직 허락하지 않았습니다.`, ...prev].slice(0, 100));
      }
      setPendingRequests((prev) => prev.filter((r) => r.id !== requestId));
    } else if (req.type === "child") {
      setPendingRequests((prev) => prev.filter((r) => r.id !== requestId));
      if (approve && a && b) {
        setNamingBaby({ aId: req.aId, bId: req.bId, aName: a.name, bName: b.name });
        setBabyNameInput(BABY_NAMES[randInt(0, BABY_NAMES.length - 1)]);
      } else if (a && b) {
        setRelationships((prev) => {
          const key = relKey(req.aId, req.bId);
          const cur = prev[key] || { score: 0, status: "결혼" };
          return { ...prev, [key]: { ...cur, childCooldownUntilTurn: turn + 6 } };
        });
        setEventLog((prev) => [`🙅 [신의 뜻] 당신은 ${a.name}와(과) ${b.name}의 아이 요청을 미루었습니다.`, ...prev].slice(0, 100));
      }
    }
  };

  const rerollBabyName = () => {
    setBabyNameInput(BABY_NAMES[randInt(0, BABY_NAMES.length - 1)]);
  };

  const confirmBabyName = () => {
    if (!namingBaby) return;
    if (characters.length >= MAX_RESIDENTS) {
      setEventLog((prev) => [`⚠️ 섬이 가득 차서(${MAX_RESIDENTS}명) 아이를 더 맞이할 수 없어요.`, ...prev].slice(0, 100));
      setNamingBaby(null);
      setBabyNameInput("");
      return;
    }
    const name = babyNameInput.trim() || BABY_NAMES[randInt(0, BABY_NAMES.length - 1)];
    const a = characters.find((c) => c.id === namingBaby.aId);
    const b = characters.find((c) => c.id === namingBaby.bId);
    if (!a || !b) {
      setNamingBaby(null);
      setBabyNameInput("");
      return;
    }
    const babyId = `m-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
    const baby = {
      id: babyId,
      name,
      personalityType: Math.random() < 0.5 ? a.personalityType : b.personalityType,
      sociability: Math.min(1, Math.max(0, (a.sociability + b.sociability) / 2 + (Math.random() * 0.2 - 0.1))),
      emotional: Math.min(1, Math.max(0, (a.emotional + b.emotional) / 2 + (Math.random() * 0.2 - 0.1))),
      hunger: randInt(10, 30),
      loneliness: randInt(10, 30),
      partner: null,
      luckyTurns: 0,
      note: "",
      keywords: Array.from(new Set([...(a.keywords || []), ...(b.keywords || [])])).slice(0, 8),
    };
    setCharacters((prev) => [...prev, baby]);
    setRelationships((prev) => {
      const next = { ...prev };
      const key = relKey(namingBaby.aId, namingBaby.bId);
      const cur = next[key] || { score: 0, status: "결혼" };
      next[key] = { ...cur, hadChild: true };
      next[relKey(namingBaby.aId, babyId)] = { score: 100, status: "가족" };
      next[relKey(namingBaby.bId, babyId)] = { score: 100, status: "가족" };
      return next;
    });
    setEventLog((prev) =>
      [`👶 [신의 축복] 당신이 지어준 이름 '${name}'을(를) 가진 아기가 ${a.name}와(과) ${b.name} 사이에서 태어났습니다!`, ...prev].slice(0, 100)
    );
    setNewsLog((prev) => [...prev, { text: `👶✨ 2세 탄생! ${a.name}님과 ${b.name}님이 부모가 되어 '${name}'을(를) 맞이했습니다! (Turn ${turn})`, category: "romance" }]);
    setNamingBaby(null);
    setBabyNameInput("");
  };

  const step = () => {
    if (characters.length === 0) return;
    if (pendingRequests.length > 0 || namingBaby) return;

    const charsById = {};
    characters.forEach((c) => (charsById[c.id] = { ...c }));
    const relMap = {};
    Object.entries(relationships).forEach(([k, v]) => (relMap[k] = { ...v }));
    const log = [];
    const news = [...newsLog];
    const newRequests = [];
    const pendingSnapshot = pendingRequests;

    const getRel = (a, b) => relMap[relKey(a, b)] || { score: 0, status: "지인" };
    const setRel = (a, b, obj) => {
      relMap[relKey(a, b)] = obj;
    };
    const hasPendingFor = (type, x, y) =>
      pendingSnapshot.some((p) => p.type === type && ((p.aId === x && p.bId === y) || (p.aId === y && p.bId === x))) ||
      newRequests.some((p) => p.type === type && ((p.aId === x && p.bId === y) || (p.aId === y && p.bId === x)));

    const updateRelationshipStatus = (aId, bId) => {
      const a = charsById[aId];
      const b = charsById[bId];
      const r = getRel(aId, bId);
      const newStatus = statusFromScore(r.score, r.status);
      if (newStatus !== r.status) {
        setRel(aId, bId, { ...r, status: newStatus });
        log.push(`✨ [관계 변화] ${a.name}과(와) ${b.name}의 관계가 '${newStatus}'가 되었습니다!`);
      }
    };

    const interact = (aId, bId) => {
      const a = charsById[aId];
      const b = charsById[bId];
      const r = getRel(aId, bId);
      const compatibility = 1 - Math.abs(a.sociability - b.sociability);
      const luckyBonus = a.luckyTurns > 0 ? 0.2 : 0;
      const sharedInterests = (a.keywords || []).filter((k) => (b.keywords || []).includes(k));
      const interestBonus = sharedInterests.length > 0 ? 0.15 : 0;
      const successChance = 0.5 + r.score / 200 + compatibility * 0.2 - a.emotional * 0.1 + luckyBonus + interestBonus;

      a.loneliness = Math.max(0, a.loneliness - 30);
      b.loneliness = Math.max(0, b.loneliness - 20);

      if (Math.random() < successChance) {
        let delta = randInt(8, 15);
        let useTopic = false;
        let topic = null;
        if (sharedInterests.length > 0 && Math.random() < 0.5) {
          topic = sharedInterests[randInt(0, sharedInterests.length - 1)];
          delta += 5;
          useTopic = true;
        }
        const newScore = Math.min(100, r.score + delta);
        setRel(aId, bId, { score: newScore, status: r.status });
        log.push(
          useTopic
            ? `💫 ${a.name}와(과) ${b.name}는 서로 적어둔 '${topic}' 이야기로 더욱 가까워졌습니다! (호감도 +${delta} → 현재: ${newScore})`
            : `💬 ${a.name}가 ${b.name}에게 유쾌한 이야기를 건넸습니다. (호감도 +${delta} → 현재: ${newScore})`
        );
        updateRelationshipStatus(aId, bId);
        const r2 = getRel(aId, bId);
        if (r2.score >= 80 && !a.partner && !b.partner) {
          const cooldownOk = !(r2.confessCooldownUntilTurn && turn + 1 < r2.confessCooldownUntilTurn);
          if (cooldownOk && !hasPendingFor("confess", aId, bId) && Math.random() < 0.5) {
            newRequests.push({ id: `req-${Date.now()}-${Math.floor(Math.random() * 10000)}`, type: "confess", aId, bId });
            log.push(`❓ [신의 뜻을 묻습니다] ${a.name}가 ${b.name}에게 마음이 생겼어요. 사귀어도 될지 여쭤봅니다...`);
          }
        } else if (a.partner === bId && r2.status === "연인" && r2.score >= 90) {
          const cooldownOk = !(r2.marriageCooldownUntilTurn && turn + 1 < r2.marriageCooldownUntilTurn);
          if (cooldownOk && !hasPendingFor("marriage", aId, bId) && Math.random() < 0.35) {
            newRequests.push({ id: `req-${Date.now()}-${Math.floor(Math.random() * 10000)}`, type: "marriage", aId, bId });
            log.push(`❓ [신의 뜻을 묻습니다] ${a.name}와(과) ${b.name}가 결혼해도 될지 여쭤봅니다...`);
          }
        }
      } else {
        const delta = randInt(8, 15);
        const newScore = Math.max(-100, r.score - delta);
        setRel(aId, bId, { score: newScore, status: r.status });
        log.push(`💥 ${a.name}와(과) ${b.name}가 성격 차이로 말다툼을 했습니다! (호감도 -${delta} → 현재: ${newScore})`);
        updateRelationshipStatus(aId, bId);
      }
    };

    const ids = characters.map((c) => c.id);
    ids.forEach((id) => {
      const c = charsById[id];
      c.hunger = Math.min(100, c.hunger + randInt(5, 12));
      c.loneliness = Math.min(100, c.loneliness + randInt(5, 15));
      c.luckyTurns = Math.max(0, (c.luckyTurns || 0) - 1);
      if (Math.random() < 0.05) {
        const eventFn = QUIRKY_EVENTS[randInt(0, QUIRKY_EVENTS.length - 1)];
        const text = eventFn(c.name);
        log.push(text);
        if (Math.random() < 0.4) news.push({ text, category: "other" });
      }
    });

    ids.forEach((id) => {
      const c = charsById[id];
      if (c.hunger >= 75) {
        c.hunger -= 60;
        log.push(`🍛 ${c.name}가 식당에서 밥을 맛있게 먹었습니다.`);
        return;
      }
      if (c.loneliness >= 40 && Math.random() < c.sociability) {
        const others = ids.filter((x) => x !== id);
        if (others.length) {
          const targetId = others[randInt(0, others.length - 1)];
          interact(id, targetId);
        }
      }
    });

    const marriedPairs = [];
    for (let i = 0; i < ids.length; i++) {
      for (let j = i + 1; j < ids.length; j++) {
        const rr = getRel(ids[i], ids[j]);
        if (rr.status === "결혼") marriedPairs.push([ids[i], ids[j]]);
      }
    }
    marriedPairs.forEach(([aId, bId]) => {
      if (ids.length >= MAX_RESIDENTS) return;
      const rr = getRel(aId, bId);
      if (rr.hadChild) return;
      if (rr.childCooldownUntilTurn && turn + 1 < rr.childCooldownUntilTurn) return;
      if (hasPendingFor("child", aId, bId)) return;
      if (Math.random() < 0.18) {
        const a = charsById[aId];
        const b = charsById[bId];
        newRequests.push({ id: `req-${Date.now()}-${Math.floor(Math.random() * 10000)}`, type: "child", aId, bId });
        log.push(`❓ [신의 뜻을 묻습니다] ${a.name}와(과) ${b.name}가 아이를 가져도 될지 여쭤봅니다...`);
      }
    });

    setCharacters(ids.map((id) => charsById[id]));
    setRelationships(relMap);
    setNewsLog(news);
    setEventLog((prev) => [...log.reverse(), ...prev].slice(0, 100));
    setTurn((t) => t + 1);
    if (newRequests.length > 0) {
      setPendingRequests((prev) => [...prev, ...newRequests]);
    }
  };

  useEffect(() => {
    if (!autoPlay) return;
    if (pendingRequests.length > 0 || namingBaby) return;
    const id = setInterval(() => {
      step();
    }, AUTOPLAY_MS);
    return () => clearInterval(id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [autoPlay, characters, relationships, newsLog, turn, pendingRequests, namingBaby]);

  const pairList = [];
  for (let i = 0; i < characters.length; i++) {
    for (let j = i + 1; j < characters.length; j++) {
      const a = characters[i];
      const b = characters[j];
      const r = relationships[relKey(a.id, b.id)] || { score: 0, status: "지인" };
      pairList.push({ a, b, r });
    }
  }
  pairList.sort((x, y) => y.r.score - x.r.score);

  const marriageCount = pairList.filter((p) => p.r.status === "결혼").length;
  const romanceNews = newsLog.filter((n) => n.category === "romance");
  const otherNews = newsLog.filter((n) => n.category === "other");
  const babyCount = romanceNews.filter((n) => n.text.includes("2세 탄생")).length;
  const talkTargetName = characters.find((c) => c.id === talkTargetId)?.name;
  const isPaused = pendingRequests.length > 0 || !!namingBaby;
  const selectedChar = characters.find((c) => c.id === selectedCharId);
  const displayedPairs = selectedCharId ? pairList.filter((p) => p.a.id === selectedCharId || p.b.id === selectedCharId) : pairList;
  const displayIslandName = islandName.trim() || "우리 섬";

  return (
    <div className="app">
      <style>{`

        .amount-input { width: 72px; }

        .request-card { border-color: var(--gold); }
        .request-item { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-radius: 10px; background: var(--gold-soft); margin-bottom: 8px; font-size: 12.5px; }
        .request-icon { font-size: 18px; }
        .request-text { flex: 1; font-weight: 700; color: #6b4f14; min-width: 160px; }
        .naming-box { margin-top: 6px; padding: 12px; border-radius: 10px; background: var(--accent-soft); }
        .naming-text { font-weight: 800; font-size: 12.5px; margin-bottom: 8px; color: var(--accent); }
        .naming-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .naming-row input[type=text] { flex: 1; min-width: 120px; font-size: 13px; padding: 8px 11px; border: 1.5px solid var(--line); border-radius: 8px; }
      `}</style>

      <div className="site-bar">
        <div className="site-title-row">
          <span className="site-title">🏝️</span>
          <input className="island-name-input" value={islandName} maxLength={14} placeholder="섬 이름을 입력하세요" onChange={(e) => setIslandName(e.target.value)} />
        </div>
        <div className="site-tagline">주민들의 배고픔·외로움·호감도가 자동으로 움직이는 관계 시뮬레이터</div>
        <button className="btn btn-ghost help-btn" onClick={() => setShowHelp(true)} type="button">
          ❓ 사용 방법
        </button>
      </div>

      {showHelp && (
        <div className="help-overlay" onClick={() => setShowHelp(false)}>
          <div className="help-modal" onClick={(e) => e.stopPropagation()}>
            <h2 className="section-title">❓ 사용 방법</h2>
            <h3>👤 주민 추가</h3>
            <p>이름과 성격 유형을 정하고, 자유 설명란에 취향이나 말투를 적어보세요. 적은 단어는 관심사로 학습돼서 비슷한 관심사를 가진 주민끼리 더 잘 통해요. 최대 {MAX_RESIDENTS}명까지 추가할 수 있어요.</p>
            <h3>🔗 관계 미리 설정하기</h3>
            <p>두 주민을 골라 시작부터 특정 관계(친구, 절친, 앙숙, 연인, 결혼)로 설정할 수 있어요.</p>
            <h3>▶ 다음 턴 / 자동 재생</h3>
            <p>턴이 지날 때마다 주민들의 배고픔·외로움이 변하고 서로 상호작용해요. 가끔 예상치 못한 기행이나 신기한 사건도 벌어져요.</p>
            <h3>🙏 신의 뜻</h3>
            <p>고백·결혼·출산처럼 중요한 순간에는 신(당신)의 허락이 필요해요. '허락한다' / '안된다' 버튼으로 결정하면 진행이 이어져요.</p>
            <h3>🗣️ 신과의 대화 / 🎁 신의 선물</h3>
            <p>원하는 주민에게 직접 말을 걸거나 아이템을 선물할 수 있어요. 아래쪽 '나만의 아이템 만들기'로 이름과 효과를 정해 새 음식·선물도 추가할 수 있어요.</p>
            <h3>💞 관계도</h3>
            <p>주민 카드를 터치하면 그 주민의 관계만 모아 볼 수 있어요. 다시 누르거나 '전체보기'를 누르면 원래대로 돌아와요.</p>
            <h3>📰 소식</h3>
            <p>연애·결혼·출산 소식은 '연애 소식'에, 그 외 신기한 사건들은 '아일랜드 소식'에 따로 모여요.</p>
            <div className="help-close-row">
              <button className="btn btn-accent" onClick={() => setShowHelp(false)} type="button">
                닫기
              </button>
            </div>
          </div>
        </div>
      )}

      <div className="container">
        <div className="card">
          <h2 className="section-title">👤 새 주민 추가</h2>
          <div className="add-form-row">
            <input
              type="text"
              placeholder="이름"
              value={formName}
              maxLength={10}
              onChange={(e) => setFormName(e.target.value)}
            />
            <input
              type="text"
              placeholder="성격 유형 (예: 열정적인)"
              value={formType}
              maxLength={12}
              onChange={(e) => setFormType(e.target.value)}
            />
          </div>
          <div className="type-chip-row">
            {TYPE_CHIPS.map((t) => (
              <button key={t} className={"type-chip" + (formType === t ? " active" : "")} onClick={() => setFormType(t)} type="button">
                {t}
              </button>
            ))}
          </div>
          <textarea
            className="note-input"
            placeholder="이 주민에 대해 자유롭게 적어보세요 (설정, 말투, 취향 등)"
            value={formNote}
            maxLength={200}
            rows={3}
            onChange={(e) => setFormNote(e.target.value)}
          />
          <div className="note-hint">💡 여기 적은 단어는 관심사로 학습돼서, 비슷한 걸 적은 주민끼리는 더 잘 통해요!</div>
          <div className="slider-row">
            <label>사교성</label>
            <input type="range" min="0" max="100" step="5" value={formSoc} onChange={(e) => setFormSoc(Number(e.target.value))} />
            <span className="slider-val">{formSoc}%</span>
          </div>
          <div className="slider-row">
            <label>감정기복</label>
            <input type="range" min="0" max="100" step="5" value={formEmo} onChange={(e) => setFormEmo(Number(e.target.value))} />
            <span className="slider-val">{formEmo}%</span>
          </div>
          <button className="btn btn-accent" onClick={addResident} disabled={!formName.trim() || characters.length >= MAX_RESIDENTS}>
            주민으로 추가 ({characters.length}/{MAX_RESIDENTS})
          </button>
        </div>

        {characters.length >= 2 && (
          <div className="card">
            <h2 className="section-title">🔗 관계 미리 설정하기</h2>
            <div className="setup-row">
              <select className="setup-select" value={setupAId} onChange={(e) => setSetupAId(e.target.value)}>
                <option value="">-- 주민 A --</option>
                {characters.map((c) => (
                  <option key={c.id} value={c.id}>
                    {c.name}
                  </option>
                ))}
              </select>
              <span>↔</span>
              <select className="setup-select" value={setupBId} onChange={(e) => setSetupBId(e.target.value)}>
                <option value="">-- 주민 B --</option>
                {characters
                  .filter((c) => c.id !== setupAId)
                  .map((c) => (
                    <option key={c.id} value={c.id}>
                      {c.name}
                    </option>
                  ))}
              </select>
              <select className="setup-select" value={setupStatus} onChange={(e) => setSetupStatus(e.target.value)}>
                {RELATION_PRESETS.map((p) => (
                  <option key={p.value} value={p.value}>
                    {p.label}
                  </option>
                ))}
              </select>
              <button
                className="btn btn-accent"
                onClick={applyInitialRelationship}
                disabled={!setupAId || !setupBId || setupAId === setupBId}
              >
                관계 설정하기
              </button>
            </div>
          </div>
        )}

        <div className="card">
          <h2 className="section-title">🏠 {displayIslandName} 주민</h2>
          <div className="control-row">
            <button className="btn btn-accent" onClick={step} disabled={characters.length === 0 || isPaused}>
              다음 턴 ▶
            </button>
            <button className={"btn " + (autoPlay ? "btn-danger" : "btn-ghost")} onClick={() => setAutoPlay((a) => !a)} disabled={characters.length === 0}>
              {autoPlay ? "자동 재생 중지" : "자동 재생"}
            </button>
            <button className="btn btn-ghost" onClick={resetAll}>
              전체 초기화
            </button>
            <span className="turn-badge">TURN {turn}</span>
            {marriageCount > 0 && (
              <span className="turn-badge" style={{ background: "var(--marriage)", color: "#fff" }}>
                💍 결혼 {marriageCount}쌍
              </span>
            )}
            {babyCount > 0 && (
              <span className="turn-badge" style={{ background: "var(--family)", color: "#fff" }}>
                👶 2세 {babyCount}명
              </span>
            )}
            {isPaused && <span className="pause-note">⏸ 신의 결정을 기다리는 중이에요</span>}
          </div>

          {characters.length === 0 ? (
            <div className="empty-state">주민을 추가하면 시뮬레이션을 시작할 수 있어요.</div>
          ) : (
            <div className="resident-grid">
              {characters.map((c) => {
                const partner = c.partner ? characters.find((x) => x.id === c.partner) : null;
                const relToPartner = partner ? relationships[relKey(c.id, partner.id)] : null;
                const familyMembers = characters.filter(
                  (other) => other.id !== c.id && (relationships[relKey(c.id, other.id)] || {}).status === "가족"
                );
                return (
                  <div
                    className={"r-card" + (selectedCharId === c.id ? " r-card-selected" : "")}
                    key={c.id}
                    onClick={() => setSelectedCharId((prev) => (prev === c.id ? null : c.id))}
                  >
                    <button
                      className="r-remove"
                      onClick={(e) => {
                        e.stopPropagation();
                        removeResident(c.id);
                      }}
                      aria-label={`${c.name} 내보내기`}
                    >
                      ×
                    </button>
                    <div className="r-card-name">{c.name}</div>
                    <div className="r-card-type">{c.personalityType}</div>
                    {c.note && <div className="r-card-note">{c.note}</div>}
                    {c.keywords && c.keywords.length > 0 && (
                      <div className="keyword-row">
                        {c.keywords.map((k) => (
                          <span className="keyword-chip" key={k}>
                            #{k}
                          </span>
                        ))}
                      </div>
                    )}
                    <div className="stat-row">
                      <div className="stat-label">
                        <span>배고픔</span>
                        <span>{c.hunger}</span>
                      </div>
                      <div className="stat-track">
                        <div className="stat-fill" style={{ width: `${c.hunger}%`, background: "var(--hunger)" }} />
                      </div>
                    </div>
                    <div className="stat-row">
                      <div className="stat-label">
                        <span>외로움</span>
                        <span>{c.loneliness}</span>
                      </div>
                      <div className="stat-track">
                        <div className="stat-fill" style={{ width: `${c.loneliness}%`, background: "var(--loneliness)" }} />
                      </div>
                    </div>
                    {partner && (
                      <div className="partner-tag" style={{ color: relToPartner?.status === "결혼" ? "var(--marriage)" : "var(--love)" }}>
                        {relToPartner?.status === "결혼" ? "💍 배우자: " : "💑 연인: "}
                        {partner.name}
                      </div>
                    )}
                    {familyMembers.length > 0 && (
                      <div className="partner-tag" style={{ color: "var(--family)" }}>
                        👨‍👩‍👧 가족: {familyMembers.map((f) => f.name).join(", ")}
                      </div>
                    )}
                    {c.luckyTurns > 0 && (
                      <div className="partner-tag" style={{ color: "var(--gold)" }}>
                        🍀 행운 효과 {c.luckyTurns}턴 남음
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {(pendingRequests.length > 0 || namingBaby) && (
          <div className="card request-card">
            <h2 className="section-title">🙏 신의 뜻을 기다리는 중</h2>
            {pendingRequests.map((req) => {
              const a = characters.find((c) => c.id === req.aId);
              const b = characters.find((c) => c.id === req.bId);
              if (!a || !b) return null;
              const questionText =
                req.type === "confess"
                  ? `${a.name}가 ${b.name}에게 사귀자고 고백해도 될까요?`
                  : req.type === "marriage"
                  ? `${a.name}와(과) ${b.name}가 결혼해도 될까요?`
                  : `${a.name}와(과) ${b.name}가 아이를 가져도 될까요?`;
              const icon = req.type === "confess" ? "💌" : req.type === "marriage" ? "💍" : "👶";
              return (
                <div className="request-item" key={req.id}>
                  <span className="request-icon">{icon}</span>
                  <span className="request-text">{questionText}</span>
                  <button className="btn btn-accent" onClick={() => resolveRequest(req.id, true)}>
                    허락한다
                  </button>
                  <button className="btn btn-danger" onClick={() => resolveRequest(req.id, false)}>
                    안된다
                  </button>
                </div>
              );
            })}
            {namingBaby && (
              <div className="naming-box">
                <div className="naming-text">
                  👶 {namingBaby.aName}와(과) {namingBaby.bName}의 아기 이름을 지어주세요
                </div>
                <div className="naming-row">
                  <input
                    type="text"
                    value={babyNameInput}
                    maxLength={10}
                    onChange={(e) => setBabyNameInput(e.target.value)}
                    placeholder="아기 이름"
                  />
                  <button className="btn btn-ghost" onClick={rerollBabyName} type="button">
                    다른 이름 추천 🎲
                  </button>
                  <button className="btn btn-accent" onClick={confirmBabyName}>
                    이 이름으로 축복하기 ✨
                  </button>
                </div>
              </div>
            )}
          </div>
        )}

        {characters.length > 0 && (
          <div className="card god-card">
            <h2 className="section-title">🗣️ 신과의 대화</h2>
            <div className="god-select-row">
              <select className="god-select" value={talkTargetId} onChange={(e) => setTalkTargetId(e.target.value)}>
                <option value="">-- 대상 주민 선택 --</option>
                {characters.map((c) => (
                  <option key={c.id} value={c.id}>
                    {c.name}
                  </option>
                ))}
              </select>
            </div>
            <div className="god-talk-row">
              <input
                type="text"
                placeholder={talkTargetName ? `${talkTargetName}에게 하고 싶은 말을 입력하세요` : "먼저 대상 주민을 선택하세요"}
                value={talkMessage}
                maxLength={60}
                disabled={!talkTargetId}
                onChange={(e) => setTalkMessage(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === "Enter") talkToCharacter();
                }}
              />
              <button className="btn btn-accent" onClick={talkToCharacter} disabled={!talkTargetId || !talkMessage.trim()}>
                말 걸기 🗣️
              </button>
            </div>
          </div>
        )}

        {characters.length > 0 && (
          <div className="card god-card">
            <h2 className="section-title">🎁 신의 선물</h2>
            <div className="god-select-row">
              <select className="god-select" value={giftTargetId} onChange={(e) => setGiftTargetId(e.target.value)}>
                <option value="">-- 대상 주민 선택 --</option>
                {characters.map((c) => (
                  <option key={c.id} value={c.id}>
                    {c.name}
                  </option>
                ))}
              </select>
            </div>
            <div className="god-item-grid">
              {godItems.map((item) => (
                <div className="god-item-card" key={item.id}>
                  {item.custom && (
                    <button className="item-remove" onClick={() => removeCustomItem(item.id)} type="button" aria-label="아이템 삭제">
                      ×
                    </button>
                  )}
                  <div className="god-item-icon">{item.icon}</div>
                  <div className="god-item-label">{item.label}</div>
                  <div className="god-item-desc">{item.desc}</div>
                  {item.needsTarget && (
                    <select className="god-select-small" value={giftSecondTargetId} onChange={(e) => setGiftSecondTargetId(e.target.value)}>
                      <option value="">상대 선택</option>
                      {characters
                        .filter((c) => c.id !== giftTargetId)
                        .map((c) => (
                          <option key={c.id} value={c.id}>
                            {c.name}
                          </option>
                        ))}
                    </select>
                  )}
                  <button
                    className="btn btn-ghost"
                    onClick={() => giveItem(item)}
                    disabled={!giftTargetId || (item.needsTarget && !giftSecondTargetId)}
                  >
                    선물하기
                  </button>
                </div>
              ))}
            </div>

            <div className="custom-item-form">
              <div className="custom-item-title">➕ 나만의 아이템 만들기</div>
              <input
                type="text"
                className="icon-input"
                value={customItemIcon}
                maxLength={2}
                onChange={(e) => setCustomItemIcon(e.target.value)}
                placeholder="🎁"
              />
              <input
                type="text"
                className="label-input"
                value={customItemLabel}
                maxLength={16}
                onChange={(e) => setCustomItemLabel(e.target.value)}
                placeholder="아이템 이름 (예: 딸기 케이크)"
              />
              <select value={customItemType} onChange={(e) => setCustomItemType(e.target.value)}>
                <option value="hunger">배고픔 감소</option>
                <option value="loneliness">외로움 감소</option>
                <option value="luck">행운 부여</option>
                <option value="relationship">호감도 상승 (상대 지정)</option>
                <option value="reconcile">화해 (상대 지정)</option>
              </select>
              {(customItemType === "hunger" || customItemType === "loneliness" || customItemType === "relationship") && (
                <input
                  type="number"
                  className="amount-input"
                  min="5"
                  max="100"
                  step="5"
                  value={customItemAmount}
                  onChange={(e) => setCustomItemAmount(Number(e.target.value))}
                />
              )}
              <button className="btn btn-accent" onClick={addCustomItem} disabled={!customItemLabel.trim()} type="button">
                아이템 추가
              </button>
            </div>
          </div>
        )}

        {characters.length >= 2 && (
          <div className="card">
            <div className="section-header-row">
              <h2 className="section-title">💞 {selectedChar ? `${selectedChar.name}의 관계` : "주민 관계도"}</h2>
              {selectedChar && (
                <button className="btn btn-ghost" onClick={() => setSelectedCharId(null)} type="button">
                  전체보기
                </button>
              )}
            </div>
            {displayedPairs.length === 0 ? (
              <div className="empty-state">아직 관계가 없어요.</div>
            ) : (
              <div className="rel-list">
                {displayedPairs.map(({ a, b, r }) => (
                  <div className="rel-item" key={`${a.id}-${b.id}`}>
                    <span className="rel-names">
                      {a.name} ↔ {b.name}
                    </span>
                    <span className="rel-badge" style={{ background: statusColor(r.status) }}>
                      {r.status}
                    </span>
                    <span className="rel-score">{r.score}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {romanceNews.length > 0 && (
          <div className="card">
            <h2 className="section-title">💕 연애 소식</h2>
            <div className="news-list">
              {[...romanceNews].reverse().map((n, i) => (
                <div className="news-line" key={i}>
                  {n.text}
                </div>
              ))}
            </div>
          </div>
        )}

        {otherNews.length > 0 && (
          <div className="card">
            <h2 className="section-title">📰 아일랜드 소식</h2>
            <div className="news-list">
              {[...otherNews].reverse().map((n, i) => (
                <div className="news-line other" key={i}>
                  {n.text}
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="card">
          <h2 className="section-title">📜 이벤트 로그</h2>
          {eventLog.length === 0 ? (
            <div className="empty-state">'다음 턴'을 눌러 시뮬레이션을 진행해보세요.</div>
          ) : (
            <div className="log-list">
              {eventLog.map((l, i) => (
                <div className="log-line" key={i}>
                  {l}
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<MoaIslandSim />);
</script>
</body>
</html>
